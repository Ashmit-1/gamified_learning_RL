<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinforcement Learning Quiz Master</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="card">
            <h1>Reinforcement Learning Quiz Master</h1>
            <p>Enter a topic to generate a personalized AI quiz!</p>
            <div class="input-group">
                <input type="text" id="topic-input" placeholder="e.g. Reinforcement Learning, Physics, Star Wars...">
                <button id="start-btn">Generate Quiz</button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="card hidden">
            <div class="loader"></div>
            <p>Our AI is crafting your quiz questions...</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card hidden">
            <div id="game-wrapper">
                <canvas id="game-canvas"></canvas>
            </div>
            <div class="quiz-header">
                <div class="header-top">
                    <span id="progress-text">Question 1 of 10</span>
                    <div class="score-badge">Score: <span id="current-score">0</span></div>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
            <h2 id="question-text">Loading question...</h2>
            <div id="options-container" class="options-grid">
                <!-- Options will be injected here -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="card hidden">
            <h2>Quiz Completed!</h2>
            <div class="score-display">
                <span id="final-score">0</span> / <span id="total-questions">10</span>
            </div>
            <p id="feedback-text">Great job!</p>
            <div class="button-group">
                <button id="review-btn">Review Answers</button>
                <button id="restart-btn">New Quiz</button>
            </div>

            <div id="review-section" class="hidden">
                <hr class="divider">
                <h3>Detailed Review</h3>
                <div id="review-container"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
